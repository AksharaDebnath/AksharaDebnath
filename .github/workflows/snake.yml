name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (brown)
        uses: Platane/snk@v3
        with:
          # safest: uses the repo owner automatically
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=#8B5A2B&color_dots=#0b0f1a,#2a2a2a,#6b4f2a,#a6753a,#d2a679
            dist/github-contribution-grid-snake.svg?color_snake=#8B5A2B&color_dots=#0b0f1a,#2a2a2a,#6b4f2a,#a6753a,#d2a679

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
