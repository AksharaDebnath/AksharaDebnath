name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate evergreen snake
        uses: Platane/snk@v3
        with:
          # safest: automatically uses your GitHub username
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.gif?color_snake=#132a13&color_dots=#ffffff,#e6e6e6,#90a955,#4f772d,#31572c
            dist/github-contribution-grid-snake.svg?color_snake=#132a13&color_dots=#ffffff,#e6e6e6,#90a955,#4f772d,#31572c

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
