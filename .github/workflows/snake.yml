name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # LIGHT (white/grey background + your greens)
            dist/github-snake-light.gif?color_snake=#132a13&color_background=#ffffff&color_dots=#ffffff,#e6e6e6,#ecf39e,#90a955,#4f772d
            dist/github-snake-light.svg?color_snake=#132a13&color_dots=#ffffff,#e6e6e6,#ecf39e,#90a955,#4f772d

            # DARK (nice on GitHub dark mode)
            dist/github-snake-dark.gif?color_snake=#90a955&color_background=#0b0f1a&color_dots=#0b0f1a,#1a1a1a,#31572c,#4f772d,#90a955
            dist/github-snake-dark.svg?color_snake=#90a955&color_dots=#0b0f1a,#1a1a1a,#31572c,#4f772d,#90a955

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
